<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Perk Ledger</title>
<meta name="description" content="Track credit card credits, annual fee offset and points.">
<meta name="theme-color" content="#eef0ec" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121417" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: one narrow phone column — card summary up top, then what to use, then reference lists. */
:root{
  --bg:#eef0ec; --surface:#fbfbf8; --line:#d9dcd4; --ink:#191c20; --muted:#5f655d;
  --brass:#8a6a22; --brass-soft:#efe4c8; --good:#2f7a4f; --good-soft:#d8ebdf; --warn:#a4561a; --warn-soft:#f6e1cf; --empty:#e2e5de;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"IBM Plex Sans", system-ui, -apple-system, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121417; --surface:#1b1e22; --line:#2d3137; --ink:#ebece7; --muted:#9aa096;
  --brass:#d6b264; --brass-soft:#3a3222; --good:#6cc392; --good-soft:#1f3328; --warn:#e6995a; --warn-soft:#3b2a1d; --empty:#2a2e33; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121417; --surface:#1b1e22; --line:#2d3137; --ink:#ebece7; --muted:#9aa096;
  --brass:#d6b264; --brass-soft:#3a3222; --good:#6cc392; --good-soft:#1f3328; --warn:#e6995a; --warn-soft:#3b2a1d; --empty:#2a2e33; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ink);margin:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{-webkit-tap-highlight-color:transparent;font-family:var(--f-body);font-size:15px;line-height:1.45;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 48px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance}
h2{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.top h1{font-size:22px;font-weight:700;letter-spacing:-.01em}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;white-space:nowrap;font-weight:500}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.add{border-style:dashed;color:var(--muted)}
.hero{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:14px}
.hero-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.hero-head h3{font-size:24px;font-weight:700;line-height:1.1}
.hero-head .sub{color:var(--muted);font-size:13px;margin-top:4px}
.big{font-size:30px;font-weight:500;letter-spacing:-.02em}
.bar{height:10px;border-radius:6px;background:var(--empty);overflow:hidden;position:relative}
.bar i{display:block;height:100%;background:var(--brass);border-radius:6px}
.bar .fee{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{display:flex;flex-direction:column;gap:2px}
.stat span{font-size:12px;color:var(--muted)}
.stat b{font-family:var(--f-mono);font-weight:500;font-size:16px}
.ghost{background:none;border:1px solid var(--line);border-radius:10px;padding:7px 12px;font-size:14px;font-weight:500}
.primary{background:var(--ink);color:var(--bg);border:0;border-radius:10px;padding:10px 16px;font-weight:600}
.points{display:flex;align-items:center;justify-content:space-between;gap:12px;border-top:1px solid var(--line);padding-top:14px}
.points .num{font-size:20px}
.points small{display:block;color:var(--muted);font-size:12px}
.due{background:var(--warn-soft);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.due h2{color:var(--warn)}
.due-row{display:flex;justify-content:space-between;gap:10px;align-items:center}
.due-row span{min-width:0}
.list{display:flex;flex-direction:column;gap:10px}
.credit{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.c-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.c-head>div{min-width:0}
.c-name{font-weight:600}
.c-note{color:var(--muted);font-size:13px}
.pill{font-size:12px;font-weight:600;border-radius:999px;padding:3px 9px;white-space:nowrap}
.pill.done{background:var(--good-soft);color:var(--good)}
.pill.part{background:var(--brass-soft);color:var(--brass)}
.pill.open{background:var(--warn-soft);color:var(--warn)}
.pill.stay{background:var(--empty);color:var(--muted)}
.c-foot{display:flex;justify-content:space-between;align-items:center;gap:10px}
.cells{display:flex;gap:3px;flex:1;min-width:0}
.cell{flex:1;height:18px;border-radius:4px;background:var(--empty);position:relative;overflow:hidden;max-width:40px}
.cell i{position:absolute;inset:auto 0 0 0;background:var(--good)}
.cell.missed{background:repeating-linear-gradient(135deg,var(--empty) 0 3px,var(--warn-soft) 3px 6px)}
.cell.now{outline:2px solid var(--ink);outline-offset:1px}
.c-amt{font-size:13px;color:var(--muted)}
.log-btn{background:var(--brass);color:var(--surface);border:0;border-radius:10px;padding:8px 14px;font-weight:600;white-space:nowrap}
.earn{display:grid;grid-template-columns:auto 1fr;gap:10px 14px;align-items:baseline;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.earn .x{font-family:var(--f-display);font-weight:700;font-size:20px;color:var(--brass);text-align:right}
.earn .t{min-width:0}
.earn .t small{display:block;color:var(--muted);font-size:13px}
.perk{padding:12px 0;border-bottom:1px solid var(--line)}
.perk:last-child{border-bottom:0}
.perk b{font-weight:600}
.perk div{color:var(--muted);font-size:13px}
.hist{display:flex;flex-direction:column}
.h-row{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.h-row .d{font-size:12px;color:var(--muted);width:52px;flex:none}
.h-row .w{flex:1;min-width:0}
.h-row .w small{display:block;color:var(--muted);font-size:12px;overflow-wrap:anywhere}
.h-row .x{background:none;border:0;color:var(--muted);font-size:18px;padding:4px 8px}
.empty{color:var(--muted);font-size:14px;padding:6px 0}
.foot{display:flex;justify-content:space-between;align-items:center;gap:10px;color:var(--muted);font-size:12px}
.sec{display:flex;flex-direction:column;gap:10px}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,12,14,.45);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--surface);border-radius:18px 18px 0 0;max-height:88vh;overflow-y:auto;
  padding:20px max(18px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px))}
.sheet-in{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.sheet h3{font-size:20px}
label{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--muted);font-weight:500}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
textarea{min-height:90px;font-size:14px}
.row{display:flex;gap:10px}
.row>*{flex:1;min-width:0}
.quick{display:flex;gap:8px;flex-wrap:wrap}
.quick button{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:7px 13px;font-family:var(--f-mono);font-size:14px}
.actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.danger{background:none;border:1px solid var(--warn);color:var(--warn);border-radius:10px;padding:9px 14px;font-weight:500;margin-right:auto}
.crow{display:grid;grid-template-columns:1fr 80px 120px 36px;gap:6px;align-items:center}
.crow input,.crow select{padding:8px;font-size:14px}
.crow .rm{background:none;border:0;color:var(--muted);font-size:18px}
.hint{font-size:12px;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:30}
@media (max-width:420px){.crow{grid-template-columns:1fr 64px;}.crow select{grid-column:1}.stats{gap:6px}.big{font-size:26px}}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .4s ease}}
.backup{display:flex;flex-direction:column;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.backup p{margin:0;color:var(--muted);font-size:13px}
.backup .actions{justify-content:flex-start}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div id="layer"></div>
<input type="file" id="import-file" accept="application/json,.json" hidden>

<script>
(function(){
const LS_KEY='perk-ledger-v1';
const MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const PER_YEAR={monthly:12,semiannual:2,annual:1};
const PERIOD_LABEL={monthly:'Monthly',semiannual:'Every 6 months',annual:'Yearly',perStay:'Per stay'};

function uid(){return Math.random().toString(36).slice(2,10)}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function ymd(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function money(v){v=Math.round(v*100)/100;return '$'+(Number.isInteger(v)?v.toLocaleString():v.toFixed(2))}
function today(){const d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate())}
function parseD(s){const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)}

function amexGold(){
  return {id:'amex-gold',name:'Amex Gold',issuer:'American Express',annualFee:325,points:0,pointsUpdated:null,since:ymd(today()),
    credits:[
      {id:'dining',name:'Dining Credit',amount:10,period:'monthly',note:'Grubhub, Five Guys, The Cheesecake Factory, Buffalo Wild Wings, Wonder. Enrollment required.'},
      {id:'uber',name:'Uber Cash',amount:10,period:'monthly',note:'US Uber rides or Uber Eats. Gold card must be in your Uber account.'},
      {id:'dunkin',name:"Dunkin' Credit",amount:7,period:'monthly',note:"US Dunkin' locations. Enrollment required."},
      {id:'resy',name:'Resy Credit',amount:50,period:'semiannual',note:'Qualifying US Resy restaurants. $50 Jan–Jun, $50 Jul–Dec. Enrollment required.'},
      {id:'hotel',name:'Hotel Collection credit',amount:100,period:'perStay',note:'$100 on-site experiential credit with 2+ consecutive nights booked through Amex Travel.'}
    ],
    earn:[
      {rate:'5x',label:'Prepaid hotels',note:'Booked at amextravel.com or the Amex Travel app'},
      {rate:'4x',label:'Restaurants worldwide',note:'Incl. US takeout and delivery. First $50,000 per calendar year, then 1x'},
      {rate:'4x',label:'US supermarkets',note:'First $25,000 per calendar year, then 1x'},
      {rate:'3x',label:'Flights',note:'Booked directly with airlines or amextravel.com. No charter or private jets'},
      {rate:'2x',label:'Other prepaid Amex Travel',note:'Eligible prepaid purchases on amextravel.com'},
      {rate:'1x',label:'Everything else',note:''}
    ],
    perks:[
      {name:'Hertz Five Star status',note:'Enrollment required. Register for Hertz Gold Plus Rewards first.'},
      {name:'The Hotel Collection',note:'Room upgrade when available plus the $100 credit, with 2+ night stays booked through Amex Travel.'}
    ],
    logs:[]};
}
function defaultState(){return {v:1,selected:'amex-gold',cards:[amexGold()]}}

let state=null, syncNote='Saved on this phone', sheet=null;
try{const raw=localStorage.getItem(LS_KEY); if(raw) state=JSON.parse(raw)}catch(e){}
if(!state||!Array.isArray(state.cards)) state=defaultState();

/* ---------- persistence (this phone) ---------- */
function persist(){
  state.savedAt=new Date().toISOString();
  try{localStorage.setItem(LS_KEY,JSON.stringify(state));syncNote='Saved on this phone'}
  catch(e){syncNote='Couldn\u2019t save. Your phone storage may be full.'}
  renderFoot();
}
async function protectStorage(){
  try{if(navigator.storage&&navigator.storage.persist&&!(await navigator.storage.persisted())) await navigator.storage.persist()}catch(e){}
}
function lastBackup(){try{return localStorage.getItem(LS_KEY+'-backup')}catch(e){return null}}
async function exportData(){
  const name='perk-ledger-backup-'+ymd(today())+'.json';
  const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
  try{
    const file=new File([blob],name,{type:'application/json'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'Perk Ledger backup'});markBackup();return}
  }catch(e){if(e&&e.name==='AbortError')return}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);markBackup();
}
function markBackup(){try{localStorage.setItem(LS_KEY+'-backup',ymd(today()))}catch(e){}render();toast('Backup saved')}
function importData(file){
  const r=new FileReader();
  r.onload=()=>{
    try{
      const d=JSON.parse(r.result);
      if(!d||!Array.isArray(d.cards)) throw new Error('bad');
      state=d; if(!state.cards.find(c=>c.id===state.selected)) state.selected=state.cards[0]?.id||null;
      persist();render();toast('Backup restored');
    }catch(e){toast('That file isn\u2019t a Perk Ledger backup')}
  };
  r.readAsText(file);
}
document.getElementById('import-file').addEventListener('change',e=>{const f=e.target.files[0];if(f)importData(f);e.target.value=''});

/* ---------- math ---------- */
function periodOf(kind,d){
  const y=d.getFullYear(),m=d.getMonth();
  if(kind==='monthly') return {start:new Date(y,m,1),end:new Date(y,m+1,0),label:MONTHS[m]};
  if(kind==='semiannual'){const h=m<6?0:6;return {start:new Date(y,h,1),end:new Date(y,h+6,0),label:h?'Jul–Dec':'Jan–Jun'}}
  if(kind==='annual') return {start:new Date(y,0,1),end:new Date(y,11,31),label:String(y)};
  return {start:new Date(y,0,1),end:new Date(y,11,31),label:String(y)};
}
function used(card,cid,s,e){const a=ymd(s),b=ymd(e);return card.logs.filter(l=>l.creditId===cid&&l.date>=a&&l.date<=b).reduce((t,l)=>t+Number(l.amount||0),0)}
function daysLeft(end){return Math.round((end-today())/864e5)+1}
function cardYear(card){
  const t=today(),y=t.getFullYear(),ys=new Date(y,0,1),ye=new Date(y,11,31);
  const got=card.logs.filter(l=>l.date>=ymd(ys)&&l.date<=ymd(ye)).reduce((s,l)=>s+Number(l.amount||0),0);
  let left=0,max=0;
  card.credits.forEach(c=>{
    const n=PER_YEAR[c.period]; if(!n) return;
    max+=c.amount*n;
    const p=periodOf(c.period,t);
    left+=Math.max(0,c.amount-used(card,c.id,p.start,p.end));
    const per=12/n, idx=Math.floor(t.getMonth()/per);
    left+=c.amount*(n-1-idx);
  });
  return {got,left,max,year:y};
}
function cells(card,c){
  const t=today(),y=t.getFullYear(),n=PER_YEAR[c.period]; if(!n) return '';
  let h='';
  for(let i=0;i<n;i++){
    const start=new Date(y,i*12/n,1),p=periodOf(c.period,start);
    const u=used(card,c.id,p.start,p.end),f=Math.min(1,u/c.amount);
    const now=t>=p.start&&t<=p.end, past=p.end<t;
    const before=card.since&&ymd(p.end)<card.since;
    const cls='cell'+(now?' now':'')+(past&&f===0&&!before?' missed':'');
    h+=`<span class="${cls}" title="${p.label}: ${money(u)} of ${money(c.amount)}"><i style="height:${f*100}%"></i></span>`;
  }
  return `<div class="cells" aria-label="${y} usage by period">${h}</div>`;
}

/* ---------- render ---------- */
function card(){return state.cards.find(c=>c.id===state.selected)||state.cards[0]}
const app=document.getElementById('app'), layer=document.getElementById('layer');

function render(){
  const c=card();
  if(!c){app.innerHTML=`<div class="top"><h1>Perk Ledger</h1></div><p class="empty">No cards yet.</p><button class="primary" data-act="addcard">Add a card</button><div class="foot" id="foot"></div>`;renderFoot();return}
  const t=today(), yr=cardYear(c), fee=Number(c.annualFee)||0;
  const net=yr.got-fee, scale=Math.max(fee,yr.max,1);
  const due=c.credits.filter(x=>PER_YEAR[x.period]).map(x=>{const p=periodOf(x.period,t);const r=x.amount-used(c,x.id,p.start,p.end);return {x,r,d:daysLeft(p.end),p}})
    .filter(o=>o.r>0&&o.d<=(o.x.period==='monthly'?10:30)).sort((a,b)=>a.d-b.d);

  app.innerHTML=`
  <div class="top"><h1>Perk Ledger</h1></div>
  <div class="chips" role="tablist">
    ${state.cards.map(k=>`<button class="chip" aria-pressed="${k.id===c.id}" data-act="pick" data-id="${esc(k.id)}">${esc(k.name)}</button>`).join('')}
    <button class="chip add" data-act="addcard">+ Add card</button>
  </div>

  <section class="hero">
    <div class="hero-head">
      <div><h3>${esc(c.name)}</h3><div class="sub">${money(fee)} annual fee · credits reset by calendar year</div></div>
      <button class="ghost" data-act="edit">Edit</button>
    </div>
    <div>
      <div class="big num">${money(yr.got)} <span style="font-size:15px;color:var(--muted);font-family:var(--f-body)">back in ${yr.year}</span></div>
      <div class="bar" style="margin-top:10px" role="img" aria-label="${money(yr.got)} used of ${money(scale)} possible; fee ${money(fee)}">
        <i style="width:${Math.min(100,yr.got/scale*100)}%"></i>
        ${fee?`<span class="fee" style="left:calc(${Math.min(100,fee/scale*100)}% - 1px)" title="Annual fee"></span>`:''}
      </div>
    </div>
    <div class="stats">
      <div class="stat"><span>${net>=0?'Ahead of fee':'To offset fee'}</span><b style="color:${net>=0?'var(--good)':'var(--warn)'}">${money(Math.abs(net))}</b></div>
      <div class="stat"><span>Still available</span><b>${money(yr.left)}</b></div>
      <div class="stat"><span>Max credits/yr</span><b>${money(yr.max)}</b></div>
    </div>
    <div class="points">
      <div><div class="num">${Number(c.points||0).toLocaleString()} pts</div><small>${c.pointsUpdated?'Updated '+fmtDate(c.pointsUpdated):'Not entered yet'}</small></div>
      <button class="ghost" data-act="points">Update points</button>
    </div>
  </section>

  ${due.length?`<section class="due"><h2>Use soon</h2>${due.map(o=>`
    <div class="due-row"><span><b>${esc(o.x.name)}</b> · ${money(o.r)} left</span><span class="num" style="font-size:13px">${o.d===1?'last day':o.d+' days'}</span></div>`).join('')}</section>`:''}

  <section class="sec"><h2>Credits</h2><div class="list">
    ${c.credits.map(x=>creditRow(c,x,t)).join('')||'<p class="empty">No credits on this card.</p>'}
  </div></section>

  ${c.earn&&c.earn.length?`<section class="sec"><h2>Earning</h2><div class="earn">
    ${c.earn.map(e=>`<div class="x">${esc(e.rate)}</div><div class="t">${esc(e.label)}${e.note?`<small>${esc(e.note)}</small>`:''}</div>`).join('')}
  </div></section>`:''}

  ${c.perks&&c.perks.length?`<section class="sec"><h2>Other benefits</h2><div class="credit" style="gap:0;padding-block:4px">
    ${c.perks.map(p=>`<div class="perk"><b>${esc(p.name)}</b>${p.note?`<div>${esc(p.note)}</div>`:''}</div>`).join('')}
  </div></section>`:''}

  <section class="sec"><h2>History</h2><div class="hist">
    ${c.logs.slice().sort((a,b)=>b.date.localeCompare(a.date)||0).slice(0,40).map(l=>{
      const cr=c.credits.find(x=>x.id===l.creditId);
      return `<div class="h-row"><span class="d num">${fmtDate(l.date,true)}</span><span class="w">${esc(cr?cr.name:'Removed credit')}${l.note?`<small>${esc(l.note)}</small>`:''}</span><span class="num">${money(l.amount)}</span><button class="x" aria-label="Delete entry" data-act="dellog" data-id="${esc(l.id)}">×</button></div>`}).join('')
      ||'<p class="empty">Nothing logged yet. Tap Log on a credit after you use it.</p>'}
  </div></section>
  <section class="sec"><h2>Backup</h2><div class="backup">
    <p>Your data lives only on this phone. Save a backup now and then (to Drive or Files) so you can restore it if you clear Chrome or switch phones.${lastBackup()?' Last backup: '+fmtDate(lastBackup())+'.':' No backup yet.'}</p>
    <div class="actions"><button class="ghost" data-act="export">Save backup</button><button class="ghost" data-act="import">Restore from backup</button></div>
  </div></section>
  <div class="foot" id="foot"></div>`;
  renderFoot();
}
function creditRow(c,x,t){
  if(x.period==='perStay'){
    const p=periodOf('annual',t),u=used(c,x.id,p.start,p.end),n=c.logs.filter(l=>l.creditId===x.id&&l.date.startsWith(String(t.getFullYear()))).length;
    return `<div class="credit"><div class="c-head"><div><div class="c-name">${esc(x.name)}</div><div class="c-note">${esc(x.note||'')}</div></div><span class="pill stay">Up to ${money(x.amount)}/stay</span></div>
      <div class="c-foot"><span class="c-amt">${n?`${n} stay${n>1?'s':''} · ${money(u)} this year`:'No stays logged this year'}</span><button class="log-btn" data-act="log" data-id="${esc(x.id)}">Log</button></div></div>`;
  }
  const p=periodOf(x.period,t),u=used(c,x.id,p.start,p.end),r=Math.max(0,x.amount-u),d=daysLeft(p.end);
  const pill=r<=0?`<span class="pill done">Used</span>`:u>0?`<span class="pill part">${money(r)} left</span>`:`<span class="pill open">${money(r)} open</span>`;
  return `<div class="credit"><div class="c-head"><div><div class="c-name">${esc(x.name)} <span class="c-amt">· ${money(x.amount)} ${x.period==='monthly'?'a month':x.period==='semiannual'?'per half-year':'a year'}</span></div><div class="c-note">${esc(x.note||'')}</div></div>${pill}</div>
    <div class="c-foot">${cells(c,x)}<button class="log-btn" data-act="log" data-id="${esc(x.id)}">Log</button></div>
    <div class="c-amt">${p.label}: ${money(u)} of ${money(x.amount)} used · resets in ${d} day${d===1?'':'s'}</div></div>`;
}
function fmtDate(s,short){const d=parseD(s);return MONTHS[d.getMonth()]+' '+d.getDate()+(short?'':', '+d.getFullYear())}
function renderFoot(){const f=document.getElementById('foot');if(f)f.innerHTML=`<span>${esc(syncNote)}</span>`}
function toast(msg){const el=document.createElement('div');el.className='toast';el.textContent=msg;document.body.appendChild(el);setTimeout(()=>el.remove(),1800)}

/* ---------- sheets ---------- */
function openSheet(html,onMount){
  layer.innerHTML=`<div class="scrim" data-act="close"></div><div class="sheet" role="dialog" aria-modal="true"><div class="sheet-in">${html}</div></div>`;
  sheet=layer.querySelector('.sheet'); onMount&&onMount(sheet);
  const f=sheet.querySelector('input,select,textarea'); if(f) setTimeout(()=>f.focus(),30);
}
function closeSheet(){layer.innerHTML='';sheet=null}

function logSheet(cid){
  const c=card(),x=c.credits.find(k=>k.id===cid),t=today();
  let r=x.amount;
  if(PER_YEAR[x.period]){const p=periodOf(x.period,t);r=Math.max(0,x.amount-used(c,x.id,p.start,p.end))}
  const pre=r>0?r:x.amount;
  const quick=[...new Set([pre,x.amount, x.amount>=20?Math.round(x.amount/2):null].filter(v=>v&&v>0))];
  openSheet(`<h3>Log ${esc(x.name)}</h3>
    <div class="hint">${PER_YEAR[x.period]?`${money(r)} left this period`:'Enter the credit you received for this stay'}</div>
    <div class="quick">${quick.map(v=>`<button type="button" data-q="${v}">${money(v)}</button>`).join('')}</div>
    <form id="f-log" class="sheet-in" style="gap:12px">
      <div class="row"><label>Amount ($)<input id="log-amt" type="number" inputmode="decimal" step="0.01" min="0.01" required value="${pre}"></label>
      <label>Date<input id="log-date" type="date" required value="${ymd(t)}"></label></div>
      <label>Note (optional)<input id="log-note" type="text" placeholder="e.g. Grubhub order"></label>
      <div class="actions"><button type="button" class="ghost" data-act="close">Cancel</button><button class="primary">Save</button></div>
    </form>`,s=>{
      s.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{s.querySelector('#log-amt').value=b.dataset.q});
      s.querySelector('#f-log').onsubmit=e=>{e.preventDefault();
        const amt=parseFloat(s.querySelector('#log-amt').value),date=s.querySelector('#log-date').value;
        if(!(amt>0)||!date) return;
        c.logs.push({id:uid(),creditId:x.id,amount:Math.round(amt*100)/100,date,note:s.querySelector('#log-note').value.trim()});
        closeSheet();persist();render();toast('Logged '+money(amt)+' '+x.name);
      };
    });
}
function pointsSheet(){
  const c=card();
  openSheet(`<h3>Points balance</h3><form id="f-pts" class="sheet-in" style="gap:12px">
    <label>Membership Rewards points<input id="pts" type="number" inputmode="numeric" min="0" step="1" value="${Number(c.points||0)}"></label>
    <div class="actions"><button type="button" class="ghost" data-act="close">Cancel</button><button class="primary">Save</button></div></form>`,s=>{
    s.querySelector('#f-pts').onsubmit=e=>{e.preventDefault();c.points=Math.max(0,parseInt(s.querySelector('#pts').value||'0',10));c.pointsUpdated=ymd(today());closeSheet();persist();render();toast('Points updated')};
  });
}
function creditRowHtml(x){
  return `<div class="crow" data-cid="${esc(x.id||'')}">
    <input placeholder="Credit name" value="${esc(x.name||'')}" data-k="name" aria-label="Credit name">
    <input type="number" step="0.01" min="0" placeholder="$" value="${x.amount??''}" data-k="amount" aria-label="Amount">
    <select data-k="period" aria-label="How often">${Object.keys(PERIOD_LABEL).map(k=>`<option value="${k}" ${x.period===k?'selected':''}>${PERIOD_LABEL[k]}</option>`).join('')}</select>
    <button type="button" class="rm" aria-label="Remove credit" data-rm>×</button>
    <input placeholder="Where it works (optional)" value="${esc(x.note||'')}" data-k="note" style="grid-column:1/-1" aria-label="Note">
  </div>`;
}
function editSheet(isNew){
  const c=isNew?{id:uid(),name:'',annualFee:0,points:0,pointsUpdated:null,since:ymd(today()),credits:[],earn:[],perks:[],logs:[]}:card();
  let armed=false;
  openSheet(`<h3>${isNew?'Add a card':'Edit '+esc(c.name)}</h3>
  <form id="f-card" class="sheet-in" style="gap:14px">
    <div class="row"><label>Card name<input id="cn" required value="${esc(c.name)}" placeholder="e.g. Chase Sapphire Preferred"></label>
    <label style="flex:0 0 110px">Annual fee ($)<input id="cf" type="number" min="0" step="1" value="${c.annualFee||0}"></label></div>
    <div class="sec" style="gap:8px"><h2>Credits</h2><div id="crows" class="list" style="gap:14px">${c.credits.map(creditRowHtml).join('')}</div>
      <button type="button" class="ghost" id="addc" style="align-self:flex-start">+ Add credit</button></div>
    <label>Earning rates, one per line: rate | category | details
      <textarea id="ce">${esc((c.earn||[]).map(e=>[e.rate,e.label,e.note].filter(Boolean).join(' | ')).join('\n'))}</textarea></label>
    <label>Other benefits, one per line: name | details
      <textarea id="cp">${esc((c.perks||[]).map(p=>[p.name,p.note].filter(Boolean).join(' | ')).join('\n'))}</textarea></label>
    <div class="actions">${isNew?'':'<button type="button" class="danger" id="del">Delete card</button>'}
      <button type="button" class="ghost" data-act="close">Cancel</button><button class="primary">Save</button></div>
  </form>`,s=>{
    const box=s.querySelector('#crows');
    const wire=()=>box.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>b.closest('.crow').remove());
    wire();
    s.querySelector('#addc').onclick=()=>{box.insertAdjacentHTML('beforeend',creditRowHtml({period:'monthly'}));wire();box.lastElementChild.querySelector('input').focus()};
    const del=s.querySelector('#del');
    if(del) del.onclick=()=>{
      if(!armed){armed=true;del.textContent='Tap again to delete '+c.name+' and its history';return}
      state.cards=state.cards.filter(k=>k.id!==c.id);state.selected=state.cards[0]?.id||null;closeSheet();persist();render();toast('Card deleted');
    };
    s.querySelector('#f-card').onsubmit=e=>{e.preventDefault();
      c.name=s.querySelector('#cn').value.trim()||'Untitled card';
      c.annualFee=Math.max(0,parseFloat(s.querySelector('#cf').value)||0);
      c.credits=[...box.querySelectorAll('.crow')].map(r=>{
        const g=k=>r.querySelector(`[data-k="${k}"]`).value;
        return {id:r.dataset.cid||uid(),name:g('name').trim(),amount:Math.max(0,parseFloat(g('amount'))||0),period:g('period'),note:g('note').trim()};
      }).filter(x=>x.name&&x.amount>0);
      c.earn=s.querySelector('#ce').value.split('\n').map(l=>l.split('|').map(p=>p.trim())).filter(p=>p[0]).map(p=>({rate:p[0],label:p[1]||'',note:p.slice(2).join(' | ')}));
      c.perks=s.querySelector('#cp').value.split('\n').map(l=>l.split('|').map(p=>p.trim())).filter(p=>p[0]).map(p=>({name:p[0],note:p.slice(1).join(' | ')}));
      if(isNew){state.cards.push(c);state.selected=c.id}
      closeSheet();persist();render();toast(isNew?'Card added':'Saved');
    };
  });
}

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]'); if(!b) return;
  const a=b.dataset.act;
  if(a==='close') return closeSheet();
  if(a==='pick'){state.selected=b.dataset.id;persist();render();return}
  if(a==='log') return logSheet(b.dataset.id);
  if(a==='points') return pointsSheet();
  if(a==='edit') return editSheet(false);
  if(a==='addcard') return editSheet(true);
  if(a==='export') return exportData();
  if(a==='import') return document.getElementById('import-file').click();
  if(a==='dellog'){
    if(b.dataset.armed){const c=card();c.logs=c.logs.filter(l=>l.id!==b.dataset.id);persist();render();toast('Entry deleted');return}
    b.dataset.armed='1';b.textContent='Delete?';b.style.color='var(--warn)';b.style.fontSize='13px';
    setTimeout(()=>{if(b.isConnected){delete b.dataset.armed;b.textContent='×';b.style.cssText=''}},3000);
  }
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&sheet)closeSheet()});

render();
protectStorage();
if('serviceWorker' in navigator) window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
window.addEventListener('focus',()=>{if(!sheet)render()});
})();
</script>
</body>
</html>
