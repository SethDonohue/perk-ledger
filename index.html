<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Perk Ledger</title>
<meta name="description" content="Track credit card credits, annual fee offset and points.">
<meta name="theme-color" content="#eef0ec" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121417" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: one narrow phone column — card summary up top, then what to use, then reference lists. */
:root{
  --bg:#eef0ec; --surface:#fbfbf8; --line:#d9dcd4; --ink:#191c20; --muted:#5f655d;
  --brass:#8a6a22; --brass-soft:#efe4c8; --good:#2f7a4f; --good-soft:#d8ebdf; --warn:#a4561a; --warn-soft:#f6e1cf; --empty:#e2e5de;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"IBM Plex Sans", system-ui, -apple-system, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121417; --surface:#1b1e22; --line:#2d3137; --ink:#ebece7; --muted:#9aa096;
  --brass:#d6b264; --brass-soft:#3a3222; --good:#6cc392; --good-soft:#1f3328; --warn:#e6995a; --warn-soft:#3b2a1d; --empty:#2a2e33; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121417; --surface:#1b1e22; --line:#2d3137; --ink:#ebece7; --muted:#9aa096;
  --brass:#d6b264; --brass-soft:#3a3222; --good:#6cc392; --good-soft:#1f3328; --warn:#e6995a; --warn-soft:#3b2a1d; --empty:#2a2e33; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ink);margin:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{-webkit-tap-highlight-color:transparent;font-family:var(--f-body);font-size:15px;line-height:1.45;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 48px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance}
h2{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.top h1{font-size:22px;font-weight:700;letter-spacing:-.01em}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;white-space:nowrap;font-weight:500}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.add{border-style:dashed;color:var(--muted)}
.hero{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:14px}
.hero-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.hero-head h3{font-size:24px;font-weight:700;line-height:1.1}
.hero-head .sub{color:var(--muted);font-size:13px;margin-top:4px}
.big{font-size:30px;font-weight:500;letter-spacing:-.02em}
.bar{height:10px;border-radius:6px;background:var(--empty);overflow:hidden;position:relative}
.bar i{display:block;height:100%;background:var(--brass);border-radius:6px}
.bar .fee{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{display:flex;flex-direction:column;gap:2px}
.stat span{font-size:12px;color:var(--muted)}
.stat b{font-family:var(--f-mono);font-weight:500;font-size:16px}
.ghost{background:none;border:1px solid var(--line);border-radius:10px;padding:7px 12px;font-size:14px;font-weight:500}
.primary{background:var(--ink);color:var(--bg);border:0;border-radius:10px;padding:10px 16px;font-weight:600}
.points{display:flex;align-items:center;justify-content:space-between;gap:12px;border-top:1px solid var(--line);padding-top:14px}
.points .num{font-size:20px}
.points small{display:block;color:var(--muted);font-size:12px}
.due{background:var(--warn-soft);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.due h2{color:var(--warn)}
.due-row{display:flex;justify-content:space-between;gap:10px;align-items:center}
.due-row span{min-width:0}
.list{display:flex;flex-direction:column;gap:10px}
.credit{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.c-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.c-head>div{min-width:0}
.c-name{font-weight:600}
.c-note{color:var(--muted);font-size:13px}
.pill{font-size:12px;font-weight:600;border-radius:999px;padding:3px 9px;white-space:nowrap}
.pill.done{background:var(--good-soft);color:var(--good)}
.pill.part{background:var(--brass-soft);color:var(--brass)}
.pill.open{background:var(--warn-soft);color:var(--warn)}
.pill.stay{background:var(--empty);color:var(--muted)}
.c-foot{display:flex;justify-content:space-between;align-items:center;gap:10px}
.cells{display:flex;gap:3px;flex:1;min-width:0}
.cell{flex:1;height:18px;border-radius:4px;background:var(--empty);position:relative;overflow:hidden;max-width:40px}
.cell i{position:absolute;inset:auto 0 0 0;background:var(--good)}
.cell.missed{background:repeating-linear-gradient(135deg,var(--empty) 0 3px,var(--warn-soft) 3px 6px)}
.cell.now{outline:2px solid var(--ink);outline-offset:1px}
.c-amt{font-size:13px;color:var(--muted)}
.log-btn{background:var(--brass);color:var(--surface);border:0;border-radius:10px;padding:8px 14px;font-weight:600;white-space:nowrap}
.earn{display:grid;grid-template-columns:auto 1fr;gap:10px 14px;align-items:baseline;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.earn .x{font-family:var(--f-display);font-weight:700;font-size:20px;color:var(--brass);text-align:right}
.earn .t{min-width:0}
.earn .t small{display:block;color:var(--muted);font-size:13px}
.perk{padding:12px 0;border-bottom:1px solid var(--line)}
.perk:last-child{border-bottom:0}
.perk b{font-weight:600}
.perk div{color:var(--muted);font-size:13px}
.hist{display:flex;flex-direction:column}
.h-row{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.h-row .d{font-size:12px;color:var(--muted);width:52px;flex:none}
.h-row .w{flex:1;min-width:0}
.h-row .w small{display:block;color:var(--muted);font-size:12px;overflow-wrap:anywhere}
.h-row .x{background:none;border:0;color:var(--muted);font-size:18px;padding:4px 8px}
.empty{color:var(--muted);font-size:14px;padding:6px 0}
.foot{display:flex;justify-content:space-between;align-items:center;gap:10px;color:var(--muted);font-size:12px}
.sec{display:flex;flex-direction:column;gap:10px}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,12,14,.45);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--surface);border-radius:18px 18px 0 0;max-height:88vh;overflow-y:auto;
  padding:20px max(18px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px))}
.sheet-in{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.sheet h3{font-size:20px}
label{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--muted);font-weight:500}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
textarea{min-height:90px;font-size:14px}
.row{display:flex;gap:10px}
.row>*{flex:1;min-width:0}
.quick{display:flex;gap:8px;flex-wrap:wrap}
.quick button{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:7px 13px;font-family:var(--f-mono);font-size:14px}
.actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.danger{background:none;border:1px solid var(--warn);color:var(--warn);border-radius:10px;padding:9px 14px;font-weight:500;margin-right:auto}
.crow{display:grid;grid-template-columns:1fr 80px 120px 36px;gap:6px;align-items:center}
.crow input,.crow select{padding:8px;font-size:14px}
.crow .rm{background:none;border:0;color:var(--muted);font-size:18px}
.hint{font-size:12px;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:30}
@media (max-width:420px){.crow{grid-template-columns:1fr 64px;}.crow select{grid-column:1}.stats{gap:6px}.big{font-size:26px}}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .4s ease}}
.linkish{background:none;border:0;padding:0;color:var(--brass);font-weight:600;text-decoration:underline;text-underline-offset:2px;font-size:inherit}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--empty);border-radius:12px;padding:3px;gap:3px}
.seg button{border:0;background:none;border-radius:9px;padding:9px;font-weight:600;color:var(--muted)}
.seg button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.use-first{background:var(--good-soft);color:var(--ink);border-radius:10px;padding:8px 10px;font-size:13px}
.use-first b{color:var(--good)}
.rank{display:flex;flex-direction:column;gap:2px}
.rank-row{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:baseline;padding:6px 8px;border-radius:8px;color:var(--muted)}
.rank-row.win{background:var(--brass-soft);color:var(--ink)}
.rank-row.win .rank-x{color:var(--brass)}
.rank-x{font-family:var(--f-display);font-weight:700;font-size:18px}
.rank-n{min-width:0;font-weight:500}
.rank-n small{display:block;font-weight:400;font-size:12px;color:var(--muted)}
.rank-v{font-size:13px}
.goal{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:14px}
.goal-head{display:flex;justify-content:space-between;align-items:center;gap:12px}
.goal-head span{min-width:0}
.goal-head small{display:block;color:var(--muted);font-size:12px}
.cert{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--bg);border-radius:10px;padding:6px 6px 6px 12px;font-size:14px}
.cert .x{background:none;border:0;color:var(--muted);font-size:18px;padding:4px 8px}
.backup{display:flex;flex-direction:column;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.backup p{margin:0;color:var(--muted);font-size:13px}
.backup .actions{justify-content:flex-start}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div id="layer"></div>
<input type="file" id="import-file" accept="application/json,.json" hidden>

<script>
(function(){
const LS_KEY='perk-ledger-v1';
const MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const PER_YEAR={monthly:12,semiannual:2,annual:1};
const PERIOD_LABEL={monthly:'Monthly',semiannual:'Every 6 months',annual:'Yearly',perStay:'Per stay',every4y:'Every 4 years',perUse:'Per use (log savings)'};

function uid(){return Math.random().toString(36).slice(2,10)}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function ymd(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function money(v){v=Math.round(v*100)/100;return '$'+(Number.isInteger(v)?v.toLocaleString():v.toFixed(2))}
function today(){const d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate())}
function parseD(s){const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)}

function amexGold(){
  return {id:'amex-gold',name:'Amex Gold',issuer:'American Express',annualFee:325,points:0,pointsUpdated:null,since:ymd(today()),
    credits:[
      {id:'dining',name:'Dining Credit',amount:10,period:'monthly',note:'Grubhub, Five Guys, The Cheesecake Factory, Buffalo Wild Wings, Wonder. Enrollment required.'},
      {id:'uber',name:'Uber Cash',amount:10,period:'monthly',note:'US Uber rides or Uber Eats. Gold card must be in your Uber account.'},
      {id:'dunkin',name:"Dunkin' Credit",amount:7,period:'monthly',note:"US Dunkin' locations. Enrollment required."},
      {id:'resy',name:'Resy Credit',amount:50,period:'semiannual',note:'Qualifying US Resy restaurants. $50 Jan–Jun, $50 Jul–Dec. Enrollment required.'},
      {id:'hotel',name:'Hotel Collection credit',amount:100,period:'perStay',note:'$100 on-site experiential credit with 2+ consecutive nights booked through Amex Travel.'}
    ],
    earn:[
      {rate:'5x',label:'Prepaid hotels',note:'Booked at amextravel.com or the Amex Travel app',cats:['hotel-amex']},
      {rate:'4x',label:'Restaurants worldwide',note:'Incl. US takeout and delivery. First $50,000 per calendar year, then 1x',cats:['dining']},
      {rate:'4x',label:'US supermarkets',note:'First $25,000 per calendar year, then 1x',cats:['groceries']},
      {rate:'3x',label:'Flights',note:'Booked directly with airlines or amextravel.com. No charter or private jets',cats:['flights']},
      {rate:'2x',label:'Other prepaid Amex Travel',note:'Eligible prepaid purchases on amextravel.com',cats:[]},
      {rate:'1x',label:'Everything else',note:'',cats:['other']}
    ],
    perks:[
      {name:'Hertz Five Star status',note:'Enrollment required. Register for Hertz Gold Plus Rewards first.'},
      {name:'The Hotel Collection',note:'Room upgrade when available plus the $100 credit, with 2+ night stays booked through Amex Travel.'}
    ],
    logs:[]};
}
function capOneVenture(){
  return {id:'cap1-venture',name:'Capital One Venture',issuer:'Capital One',annualFee:95,feeDate:'2026-09-01',pointsUnit:'miles',points:0,pointsUpdated:null,since:ymd(today()),
    credits:[
      {id:'global-entry',name:'Global Entry / TSA PreCheck',amount:120,period:'every4y',note:'Application fee credit once every 4 years. Pay the fee with this card.'},
      {id:'lifestyle',name:'Lifestyle Collection credit',amount:50,period:'perStay',note:'$50 experience credit per stay at Lifestyle Collection hotels and vacation rentals booked through Capital One Travel.'}
    ],
    earn:[
      {rate:'5x',label:'Hotels, vacation rentals, rental cars',note:'Booked through Capital One Travel',cats:['hotel-c1','car-c1']},
      {rate:'5x',label:'Capital One Entertainment',note:'Tickets bought through Capital One Entertainment',cats:['tickets-c1']},
      {rate:'2x',label:'Everything else',note:'Unlimited, no caps',cats:['other']}
    ],
    perks:[
      {name:'Hertz Five Star status',note:'Enroll through the Capital One website or app. Enrolling at Hertz directly doesn\u2019t count.'},
      {name:'Transfer miles to travel partners',note:'15+ airline and hotel programs, mostly 1:1 (e.g. Air France-KLM, British Airways, Singapore, Wyndham).'},
      {name:'Erase travel purchases',note:'Redeem miles against any travel charge on the card.'},
      {name:'No foreign transaction fees',note:''},
      {name:'Lifestyle Collection hotel perks',note:'WiFi, room upgrades when available and the $50 credit above.'},
      {name:'Travel and purchase protection',note:'Rental car coverage, trip cancellation/interruption, lost luggage, extended warranty. Terms vary by card network; check your guide to benefits.'},
      {name:'Capital One Lounges (paid)',note:'$45 per visit. The 2 free visits a year ended January 1, 2025.'}
    ],
    logs:[]};
}
/* Spending categories for the Best card tab. Credits list which categories they apply to. */
const CATS=[
  {id:'dining',name:'Restaurants, takeout & delivery',hint:'Includes Dunkin\u2019, Resy restaurants, Grubhub'},
  {id:'groceries',name:'Groceries',hint:'US supermarkets. Not Costco, Walmart or Target'},
  {id:'gas',name:'Gas & EV charging',hint:'Diesel included'},
  {id:'alaska',name:'Alaska & Hawaiian Airlines',hint:'Flights and purchases with the airlines',parent:'flights'},
  {id:'flights',name:'Other airlines',hint:'Booked with the airline or a card\u2019s travel site'},
  {id:'hotel-amex',name:'Hotel via Amex Travel',hint:'Prepaid at amextravel.com'},
  {id:'hotel-c1',name:'Hotel or rental via Capital One Travel',hint:'Hotels and vacation rentals'},
  {id:'hotel',name:'Hotel booked directly',hint:'On the hotel\u2019s own site or at the desk'},
  {id:'car-c1',name:'Rental car via Capital One Travel',hint:''},
  {id:'car',name:'Rental car booked directly',hint:'Hertz, Enterprise, etc.'},
  {id:'rides',name:'Uber, Lyft & rides',hint:'Uber Eats counts here for Uber Cash'},
  {id:'streaming',name:'Cable & streaming',hint:'Netflix, Spotify, cable and the like'},
  {id:'tickets-c1',name:'Tickets via Capital One Entertainment',hint:'Concerts, sports, shows'},
  {id:'other',name:'Everything else',hint:'Shopping, Costco, bills, tickets bought elsewhere'}
];
const CREDIT_CATS={dining:['dining'],resy:['dining'],dunkin:['dining'],uber:['rides','dining'],hotel:['hotel-amex'],lifestyle:['hotel-c1']};
function guessCats(e){
  const t=(e.label+' '+(e.note||'')).toLowerCase(), c=[];
  if(/restaurant|dining/.test(t)) c.push('dining');
  if(/supermarket|grocer/.test(t)) c.push('groceries');
  if(/flight|airfare|airline/.test(t)) c.push('flights');
  if(/hotel/.test(t)) c.push(/amex ?travel/.test(t)?'hotel-amex':/capital one travel/.test(t)?'hotel-c1':'hotel');
  if(/rental car|car rental/.test(t)) c.push(/capital one travel/.test(t)?'car-c1':'car');
  if(/uber|lyft|rideshare|transit/.test(t)) c.push('rides');
  if(/\bgas\b|fuel|ev charging/.test(t)) c.push('gas');
  if(/streaming|cable/.test(t)) c.push('streaming');
  if(/everything|all other|all purchases|every purchase/.test(t)) c.push('other');
  return c;
}
function rateNum(r){const m=String(r).match(/[\d.]+/);return m?parseFloat(m[0]):0}
function cardRate(card,cat){
  let best=null,fallback=null;
  const parent=(CATS.find(k=>k.id===cat)||{}).parent;
  (card.earn||[]).forEach(e=>{
    const cats=e.cats||guessCats(e), r=rateNum(e.rate);
    if((cats.includes(cat)||(parent&&cats.includes(parent)))&&(!best||r>best.r)) best={r,e};
    if(cats.includes('other')&&(!fallback||r>fallback.r)) fallback={r,e};
  });
  return best||fallback||{r:1,e:null};
}
/* Certificates (e.g. a companion fare): earned once, used once, with an expiration date. */
function openCerts(x){return (x.certs||[]).filter(k=>!k.used&&k.expires>=ymd(today())).sort((a,b)=>a.expires.localeCompare(b.expires))}
function openCredits(cat){
  const t=today(), out=[];
  state.cards.forEach(card=>card.credits.forEach(x=>{
    const cats=x.cats||CREDIT_CATS[x.id]||[]; if(!cats.includes(cat)) return;
    if(PER_YEAR[x.period]){const p=periodOf(x.period,t);const r=x.amount-used(card,x.id,p.start,p.end);if(r>0)out.push({card,x,txt:`${money(r)} left in ${p.label}`})}
    else if(x.period==='perStay') out.push({card,x,txt:`up to ${money(x.amount)} per stay`});
    else if(x.certable){const oc=openCerts(x);if(oc.length)out.push({card,x,txt:`${oc.length} available, expires ${fmtDate(oc[0].expires)}`})}
    else if(x.period==='perUse'&&x.tip) out.push({card,x,txt:x.tip});
  }));
  return out;
}
function renderBest(){
  const cards=state.cards;
  const rows=CATS.map(cat=>{
    const ranked=cards.map(card=>{const r=cardRate(card,cat.id);const pv=Number(card.pointValue??1);
      const perk=card.credits.some(x=>(x.cats||CREDIT_CATS[x.id]||[]).includes(cat.id));
      const goal=!!(card.goal&&(card.goal.spent||0)<card.goal.target);
      return {card,r:r.r,e:r.e,val:r.r*pv,perk,goal}}).sort((a,b)=>b.val-a.val||(b.perk-a.perk)||(b.goal-a.goal));
    const top=ranked[0], same=ranked.length>1&&ranked[1].val===top.val, tie=same&&ranked[1].perk===top.perk&&ranked[1].goal===top.goal;
    const why=same&&!tie?(top.perk!==ranked[1].perk?`${esc(top.card.name)}\u2019s benefits above make it the better pick`:`spending on ${esc(top.card.name)} also counts toward the ${money(top.card.goal.target)} ${esc(top.card.goal.short||'spending goal')} (${money(top.card.goal.target-(top.card.goal.spent||0))} to go)`):'';
    const credits=openCredits(cat.id);
    return `<div class="credit best">
      <div class="c-head"><div><div class="c-name">${esc(cat.name)}</div>${cat.hint?`<div class="c-note">${esc(cat.hint)}</div>`:''}</div></div>

/* A spending goal runs a year from its own start date (e.g. the card's offer/anniversary date). */
function goalWindow(g){
  if(!g||!g.start) return null;
  const a=parseD(g.start), t=today(); let y=t.getFullYear();
  const at=yy=>new Date(yy,a.getMonth(),Math.min(a.getDate(),new Date(yy,a.getMonth()+1,0).getDate()));
  while(at(y)>t) y--;
  while(at(y+1)<=t) y++;
  const start=at(y), next=at(y+1), end=new Date(next.getFullYear(),next.getMonth(),next.getDate()-1);
  return {start,end,next};
}

/* ---------- math ---------- */
function periodOf(kind,d){
  const y=d.getFullYear(),m=d.getMonth();
  if(kind==='monthly') return {start:new Date(y,m,1),end:new Date(y,m+1,0),label:MONTHS[m]};
  if(kind==='semiannual'){const h=m<6?0:6;return {start:new Date(y,h,1),end:new Date(y,h+6,0),label:h?'Jul–Dec':'Jan–Jun'}}
  if(kind==='annual') return {start:new Date(y,0,1),end:new Date(y,11,31),label:String(y)};
  return {start:new Date(y,0,1),end:new Date(y,11,31),label:String(y)};
}
function used(card,cid,s,e){const a=ymd(s),b=ymd(e);return card.logs.filter(l=>l.creditId===cid&&l.date>=a&&l.date<=b).reduce((t,l)=>t+Number(l.amount||0),0)}
function daysLeft(end){return Math.round((end-today())/864e5)+1}
/* The fee year runs 12 months from the month the annual fee was charged.
   Without a fee date it falls back to the calendar year. */
function feeWindow(card){
  const t=today();
  if(card.feeDate){
    const f=parseD(card.feeDate); let y=f.getFullYear();
    while(new Date(y+1,f.getMonth(),1)<=t) y++;
    while(new Date(y,f.getMonth(),1)>t) y--;
    const start=new Date(y,f.getMonth(),1), end=new Date(y+1,f.getMonth(),0);
    const next=new Date(y+1,f.getMonth(),Math.min(f.getDate(),new Date(y+1,f.getMonth()+1,0).getDate()));
    return {start,end,next,label:MONTHS[start.getMonth()]+' '+start.getFullYear()+' \u2013 '+MONTHS[end.getMonth()]+' '+end.getFullYear(),byFee:true};
  }
  const y=t.getFullYear();
  return {start:new Date(y,0,1),end:new Date(y,11,31),next:null,label:String(y),byFee:false};
}
function cardYear(card){
  const t=today(), w=feeWindow(card), a=ymd(w.start), b=ymd(w.end);
  const got=card.logs.filter(l=>l.date>=a&&l.date<=b).reduce((s,l)=>s+Number(l.amount||0),0);
  let left=0,max=0;
  card.credits.forEach(c=>{
    if(!PER_YEAR[c.period]) return;
    let p=periodOf(c.period,w.start);
    while(p.start<=w.end){
      max+=c.amount;
      if(p.start>t) left+=c.amount;
      else if(p.end>=t) left+=Math.max(0,c.amount-used(card,c.id,p.start,p.end));
      p=periodOf(c.period,new Date(p.end.getFullYear(),p.end.getMonth(),p.end.getDate()+1));
    }
  });
  return {got,left,max,w};
}
function cells(card,c){
  const t=today(),y=t.getFullYear(),n=PER_YEAR[c.period]; if(!n) return '';
  let h='';
  for(let i=0;i<n;i++){
    const start=new Date(y,i*12/n,1),p=periodOf(c.period,start);
    const u=used(card,c.id,p.start,p.end),f=Math.min(1,u/c.amount);
    const now=t>=p.start&&t<=p.end, past=p.end<t;
    const before=card.since&&ymd(p.end)<card.since;
    const cls='cell'+(now?' now':'')+(past&&f===0&&!before?' missed':'');
    h+=`<span class="${cls}" title="${p.label}: ${money(u)} of ${money(c.amount)}"><i style="height:${f*100}%"></i></span>`;
  }
  return `<div class="cells" aria-label="${y} usage by period">${h}</div>`;
}

      <div class="c-foot"><button class="linkish" data-act="addcert" data-id="${esc(x.id)}">+ Add certificate</button><span class="c-amt">${u?`Saved ${money(u)} this year`:''}</span><button class="log-btn" data-act="log" data-id="${esc(x.id)}">Log use</button></div></div>`;

  }
  if(x.period==='perStay'){
    const p=periodOf('annual',t),u=used(c,x.id,p.start,p.end),n=c.logs.filter(l=>l.creditId===x.id&&l.date.startsWith(String(t.getFullYear()))).length;
    return `<div class="credit"><div class="c-head"><div><div class="c-name">${esc(x.name)}</div><div class="c-note">${esc(x.note||'')}</div></div><span class="pill stay">Up to ${money(x.amount)}/stay</span></div>
      <div class="c-foot"><span class="c-amt">${n?`${n} stay${n>1?'s':''} · ${money(u)} this year`:'No stays logged this year'}</span><button class="log-btn" data-act="log" data-id="${esc(x.id)}">Log</button></div></div>`;
  }
  const p=periodOf(x.period,t),u=used(c,x.id,p.start,p.end),r=Math.max(0,x.amount-u),d=daysLeft(p.end);
  const pill=r<=0?`<span class="pill done">Used</span>`:u>0?`<span class="pill part">${money(r)} left</span>`:`<span class="pill open">${money(r)} open</span>`;
  return `<div class="credit"><div class="c-head"><div><div class="c-name">${esc(x.name)} <span class="c-amt">· ${money(x.amount)} ${x.period==='monthly'?'a month':x.period==='semiannual'?'per half-year':'a year'}</span></div><div class="c-note">${esc(x.note||'')}</div></div>${pill}</div>
    <div class="c-foot">${cells(c,x)}<button class="log-btn" data-act="log" data-id="${esc(x.id)}">Log</button></div>
    <div class="c-amt">${p.label}: ${money(u)} of ${money(x.amount)} used · resets in ${d} day${d===1?'':'s'}</div></div>`;
}
function fmtDate(s,short){const d=parseD(s);return MONTHS[d.getMonth()]+' '+d.getDate()+(short?'':', '+d.getFullYear())}
function renderFoot(){const f=document.getElementById('foot');if(f)f.innerHTML=`<span>${esc(syncNote)}</span>`}
function toast(msg){const el=document.createElement('div');el.className='toast';el.textContent=msg;document.body.appendChild(el);setTimeout(()=>el.remove(),1800)}

/* ---------- sheets ---------- */
function openSheet(html,onMount){
  layer.innerHTML=`<div class="scrim" data-act="close"></div><div class="sheet" role="dialog" aria-modal="true"><div class="sheet-in">${html}</div></div>`;
  sheet=layer.querySelector('.sheet'); onMount&&onMount(sheet);
  const f=sheet.querySelector('input,select,textarea'); if(f) setTimeout(()=>f.focus(),30);
}
function closeSheet(){layer.innerHTML='';sheet=null}

function logSheet(cid){
  const c=card(),x=c.credits.find(k=>k.id===cid),t=today();
  let r=x.amount;
  if(PER_YEAR[x.period]){const p=periodOf(x.period,t);r=Math.max(0,x.amount-used(c,x.id,p.start,p.end))}
  const pre=r>0?r:(x.amount||'');
  const quick=[...new Set([pre,x.amount, x.amount>=20?Math.round(x.amount/2):null].filter(v=>v&&v>0))];
  openSheet(`<h3>Log ${esc(x.name)}</h3>
    <div class="hint">${PER_YEAR[x.period]?`${money(r)} left this period`:x.period==='every4y'?'Set the date to when the fee credit posted, even if it was years ago':x.period==='perUse'?'Enter about how much this saved you':'Enter the credit you received for this stay'}</div>
    <div class="quick">${quick.map(v=>`<button type="button" data-q="${v}">${money(v)}</button>`).join('')}</div>
    <form id="f-log" class="sheet-in" style="gap:12px">
      <div class="row"><label>Amount ($)<input id="log-amt" type="number" inputmode="decimal" step="0.01" min="0.01" required value="${pre}"></label>
      <label>Date<input id="log-date" type="date" required value="${ymd(t)}"></label></div>
      <label>Note (optional)<input id="log-note" type="text" placeholder="${x.certable?'e.g. SEA to Kauai, March':'e.g. Grubhub order'}"></label>
      ${x.certable&&openCerts(x).length?`<label style="flex-direction:row;align-items:center;gap:8px;color:var(--ink)"><input id="log-cert" type="checkbox" checked style="width:auto"> Mark the certificate expiring ${fmtDate(openCerts(x)[0].expires)} as used</label>`:''}
      <div class="actions"><button type="button" class="ghost" data-act="close">Cancel</button><button class="primary">Save</button></div>
    </form>`,s=>{
      s.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{s.querySelector('#log-amt').value=b.dataset.q});
      s.querySelector('#f-log').onsubmit=e=>{e.preventDefault();
        const amt=parseFloat(s.querySelector('#log-amt').value),date=s.querySelector('#log-date').value;
        if(!(amt>0)||!date) return;
        const entry={id:uid(),creditId:x.id,amount:Math.round(amt*100)/100,date,note:s.querySelector('#log-note').value.trim()};
        const cb=s.querySelector('#log-cert');
        if(cb&&cb.checked){const k=openCerts(x)[0];k.used=true;k.usedOn=date;entry.certId=k.id}
        c.logs.push(entry);
        closeSheet();persist();render();toast('Logged '+money(amt)+' '+x.name);
      };
    });
}
function addChooser(){
  openSheet(`<h3>Add a card</h3><div class="hint">Start from a card with its benefits filled in, or build your own.</div>
    <div class="list">${CATALOG.map(t=>`<button class="ghost" style="text-align:left;padding:12px 14px" data-act="addtpl" data-key="${t.key}">${esc(t.name)}${state.cards.some(c=>c.id===t.key)?' <span class="hint">(already added)</span>':''}</button>`).join('')}
    <button class="ghost" style="text-align:left;padding:12px 14px" data-act="addblank">Blank card</button></div>
    <div class="actions"><button type="button" class="ghost" data-act="close">Cancel</button></div>`);
}
function goalBlock(c,yr){
  const g=c.goal, f=Math.min(1,(g.spent||0)/g.target), left=Math.max(0,g.target-(g.spent||0));
  const gw=goalWindow(g);
  const by=gw?` by ${fmtDate(ymd(gw.end))} (${daysLeft(gw.end)-1} days)`:yr.w.byFee?` by ${fmtDate(ymd(yr.w.next))}`:'';
  return `<div class="goal">
    <div class="goal-head"><span><b>${esc(g.label)}</b><small>${left?`${money(left)} to go${by}`:'Goal reached. The fare arrives on your anniversary.'}${g.updated?' · updated '+fmtDate(g.updated):''}</small></span>
      <button class="ghost" data-act="goal">Update spend</button></div>
    <div class="bar"><i style="width:${f*100}%;background:${f>=1?'var(--good)':'var(--brass)'}"></i></div>
    <div class="c-amt"><span class="num">${money(g.spent||0)} of ${money(g.target)}</span>${gw?` · spending year ${fmtDate(ymd(gw.start))} \u2013 ${fmtDate(ymd(gw.end))}`:''}${g.lastYear?` · last year ${money(g.lastYear.spent)}`:''}</div>
  </div>`;
}
function certSheet(cid){
  const c=card(), x=c.credits.find(k=>k.id===cid);
  openSheet(`<h3>Add ${esc(x.name)} certificate</h3><div class="hint">Find the expiration date in your Alaska account under Wallet / Certificates.</div>
    <form id="f-cert" class="sheet-in" style="gap:12px"><label>Expires on<input id="ce-exp" type="date" required></label>
    <div class="actions"><button type="button" class="ghost" data-act="close">Cancel</button><button class="primary">Add</button></div></form>`,s=>{
    s.querySelector('#f-cert').onsubmit=e=>{e.preventDefault();const v=s.querySelector('#ce-exp').value;if(!v)return;
      x.certs=x.certs||[];x.certs.push({id:uid(),expires:v,added:ymd(today())});closeSheet();persist();render();toast('Certificate added')};
  });
}
function goalSheet(){
  const c=card(), g=c.goal;
  openSheet(`<h3>Spending this card year</h3><div class="hint">${esc(g.note||'')} Copy the total from your Bank of America app (purchases since your last anniversary).</div>
    <form id="f-goal" class="sheet-in" style="gap:12px">
    <label>Spent so far ($)<input id="gs" type="number" inputmode="decimal" min="0" step="0.01" value="${g.spent||0}"></label>
    <div class="actions"><button type="button" class="ghost" data-act="close">Cancel</button><button class="primary">Save</button></div></form>`,s=>{
    s.querySelector('#f-goal').onsubmit=e=>{e.preventDefault();g.spent=Math.max(0,parseFloat(s.querySelector('#gs').value)||0);g.updated=ymd(today());closeSheet();persist();render();toast('Spending updated')};
  });
}
function pointsSheet(){
  const c=card();
  openSheet(`<h3>${c.pointsUnit==='miles'?'Miles':'Points'} balance</h3><form id="f-pts" class="sheet-in" style="gap:12px">
    <label>${esc(c.name)} ${c.pointsUnit==='miles'?'miles':'points'}<input id="pts" type="number" inputmode="numeric" min="0" step="1" value="${Number(c.points||0)}"></label>
    <div class="actions"><button type="button" class="ghost" data-act="close">Cancel</button><button class="primary">Save</button></div></form>`,s=>{
    s.querySelector('#f-pts').onsubmit=e=>{e.preventDefault();c.points=Math.max(0,parseInt(s.querySelector('#pts').value||'0',10));c.pointsUpdated=ymd(today());closeSheet();persist();render();toast('Points updated')};
  });
}
function creditRowHtml(x){
  return `<div class="crow" data-cid="${esc(x.id||'')}">
    <input placeholder="Credit name" value="${esc(x.name||'')}" data-k="name" aria-label="Credit name">
    <input type="number" step="0.01" min="0" placeholder="$" value="${x.amount??''}" data-k="amount" aria-label="Amount">
    <select data-k="period" aria-label="How often">${Object.keys(PERIOD_LABEL).map(k=>`<option value="${k}" ${x.period===k?'selected':''}>${PERIOD_LABEL[k]}</option>`).join('')}</select>
    <button type="button" class="rm" aria-label="Remove credit" data-rm>×</button>
    <input placeholder="Where it works (optional)" value="${esc(x.note||'')}" data-k="note" style="grid-column:1/-1" aria-label="Note">
  </div>`;
}
function editSheet(isNew){
  const c=isNew?{id:uid(),name:'',annualFee:0,points:0,pointsUpdated:null,since:ymd(today()),credits:[],earn:[],perks:[],logs:[]}:card();
  let armed=false;
  openSheet(`<h3>${isNew?'Add a card':'Edit '+esc(c.name)}</h3>
  <form id="f-card" class="sheet-in" style="gap:14px">
    <label>Card name<input id="cn" required value="${esc(c.name)}" placeholder="e.g. Chase Sapphire Preferred"></label>
    <div class="row"><label>Annual fee ($)<input id="cf" type="number" min="0" step="1" value="${c.annualFee||0}"></label>
    <label>Fee charged on<input id="cfd" type="date" value="${esc(c.feeDate||'')}"></label></div>
    ${c.goal?`<div class="row"><label>Spending year starts<input id="cgs" type="date" value="${esc(c.goal.start||'')}"></label>
    <label>Spending goal ($)<input id="cgt" type="number" min="0" step="1" value="${c.goal.target}"></label></div>
    <div class="hint">${esc(c.goal.label)}. The spending total resets to $0 when a new spending year starts.</div>`:''}
    <label>Value per point or mile (cents)<input id="cpv" type="number" min="0" step="0.05" value="${c.pointValue??1}"></label>
    <div class="hint">The most recent date the annual fee posted. Fee coverage is counted for the 12 months starting that month, and rolls over each year on its own.</div>
    <div class="sec" style="gap:8px"><h2>Credits</h2><div id="crows" class="list" style="gap:14px">${c.credits.map(creditRowHtml).join('')}</div>
      <button type="button" class="ghost" id="addc" style="align-self:flex-start">+ Add credit</button></div>
    <label>Earning rates, one per line: rate | category | details
      <textarea id="ce">${esc((c.earn||[]).map(e=>[e.rate,e.label,e.note].filter(Boolean).join(' | ')).join('\n'))}</textarea></label>
    <label>Other benefits, one per line: name | details
      <textarea id="cp">${esc((c.perks||[]).map(p=>[p.name,p.note].filter(Boolean).join(' | ')).join('\n'))}</textarea></label>
    <div class="actions">${isNew?'':'<button type="button" class="danger" id="del">Delete card</button>'}
      <button type="button" class="ghost" data-act="close">Cancel</button><button class="primary">Save</button></div>
  </form>`,s=>{
    const box=s.querySelector('#crows');
    const wire=()=>box.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>b.closest('.crow').remove());
    wire();
    s.querySelector('#addc').onclick=()=>{box.insertAdjacentHTML('beforeend',creditRowHtml({period:'monthly'}));wire();box.lastElementChild.querySelector('input').focus()};
    const del=s.querySelector('#del');
    if(del) del.onclick=()=>{
      if(!armed){armed=true;del.textContent='Tap again to delete '+c.name+' and its history';return}
      state.cards=state.cards.filter(k=>k.id!==c.id);state.selected=state.cards[0]?.id||null;closeSheet();persist();render();toast('Card deleted');
    };
    s.querySelector('#f-card').onsubmit=e=>{e.preventDefault();
      c.name=s.querySelector('#cn').value.trim()||'Untitled card';
      c.annualFee=Math.max(0,parseFloat(s.querySelector('#cf').value)||0);
      c.feeDate=s.querySelector('#cfd').value||null;
      c.pointValue=Math.max(0,parseFloat(s.querySelector('#cpv').value)||0);
      if(c.goal){const gs=s.querySelector('#cgs').value||null;if(gs!==c.goal.start){c.goal.start=gs;c.goal.windowStart=gs?ymd(goalWindow(c.goal).start):null}
        c.goal.target=Math.max(1,parseFloat(s.querySelector('#cgt').value)||c.goal.target)}
      c.credits=[...box.querySelectorAll('.crow')].map(r=>{
        const g=k=>r.querySelector(`[data-k="${k}"]`).value;
        return {id:r.dataset.cid||uid(),name:g('name').trim(),amount:Math.max(0,parseFloat(g('amount'))||0),period:g('period'),note:g('note').trim()};
      }).filter(x=>x.name&&(x.amount>0||x.period==='perUse')).map(x=>{const old=c.credits.find(o=>o.id===x.id);if(old){if(old.cats)x.cats=old.cats;if(old.tip)x.tip=old.tip}return x});
      c.earn=s.querySelector('#ce').value.split('\n').map(l=>l.split('|').map(p=>p.trim())).filter(p=>p[0]).map(p=>{const o={rate:p[0],label:p[1]||'',note:p.slice(2).join(' | ')};const old=(c.earn||[]).find(e=>e.rate===o.rate&&e.label===o.label);o.cats=old&&old.cats?old.cats:guessCats(o);return o});
      c.perks=s.querySelector('#cp').value.split('\n').map(l=>l.split('|').map(p=>p.trim())).filter(p=>p[0]).map(p=>({name:p[0],note:p.slice(1).join(' | ')}));
      if(isNew){state.cards.push(c);state.selected=c.id}
      closeSheet();persist();render();toast(isNew?'Card added':'Saved');
    };
  });
}

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]'); if(!b) return;
  const a=b.dataset.act;
  if(a==='close') return closeSheet();
  if(a==='view'){state.view=b.dataset.v;persist();render();window.scrollTo(0,0);return}
  if(a==='pick'){state.selected=b.dataset.id;persist();render();return}
  if(a==='log') return logSheet(b.dataset.id);
  if(a==='points') return pointsSheet();
  if(a==='goal') return goalSheet();
  if(a==='addcert') return certSheet(b.dataset.id);
  if(a==='delcert'){
    if(b.dataset.armed){const x=card().credits.find(k=>k.id===b.dataset.cid);x.certs=x.certs.filter(k=>k.id!==b.dataset.id);persist();render();toast('Certificate removed');return}
    b.dataset.armed='1';b.textContent='Remove?';b.style.color='var(--warn)';b.style.fontSize='13px';
    setTimeout(()=>{if(b.isConnected){delete b.dataset.armed;b.textContent='×';b.style.cssText=''}},3000);return;
  }
  if(a==='edit') return editSheet(false);
  if(a==='addcard') return addChooser();
  if(a==='addblank'){closeSheet();return editSheet(true)}
  if(a==='addtpl'){const t=CATALOG.find(k=>k.key===b.dataset.key);const n=t.make();if(state.cards.some(k=>k.id===n.id))n.id=n.id+'-'+uid();n.feeDate=null;state.cards.push(n);state.selected=n.id;closeSheet();persist();render();toast(n.name+' added. Tap Edit to set the fee date.');return}
  if(a==='export') return exportData();
  if(a==='import') return document.getElementById('import-file').click();
  if(a==='dellog'){
    if(b.dataset.armed){const c=card();const l=c.logs.find(l=>l.id===b.dataset.id);
      if(l&&l.certId)c.credits.forEach(x=>(x.certs||[]).forEach(k=>{if(k.id===l.certId){k.used=false;delete k.usedOn}}));
      c.logs=c.logs.filter(l=>l.id!==b.dataset.id);persist();render();toast('Entry deleted');return}
    b.dataset.armed='1';b.textContent='Delete?';b.style.color='var(--warn)';b.style.fontSize='13px';
    setTimeout(()=>{if(b.isConnected){delete b.dataset.armed;b.textContent='×';b.style.cssText=''}},3000);
  }
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&sheet)closeSheet()});

render();
protectStorage();
if('serviceWorker' in navigator) window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
window.addEventListener('focus',()=>{if(!sheet){rollGoals();render()}});
})();
</script>
</body>
</html>
